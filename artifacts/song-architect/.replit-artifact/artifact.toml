kind = "web"
previewPath = "/"
title = "Song Architect"
version = "1.0.0"
id = "artifacts/song-architect"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20812

[services.development]
run = "pnpm --filter @workspace/song-architect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/song-architect", "run", "build" ]
publicDir = "artifacts/song-architect/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20812"
BASE_PATH = "/"
