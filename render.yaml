services:
  - type: web
    name: sonatrack
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8080"
      - key: SERVE_STATIC
        value: "true"
      - key: LOG_LEVEL
        value: info
