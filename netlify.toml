[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/song-architect run build"
  publish = "artifacts/song-architect/dist/public"

[build.environment]
  NODE_VERSION = "24"
  COREPACK_ENABLE_STRICT = "0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
